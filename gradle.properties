# VoxBridge — Gradle properties.
#
# android.useAndroidX is MANDATORY: every dependency is androidx.*, and AGP aborts the build with
# "This project uses AndroidX dependencies, but the 'android.useAndroidX' property is not enabled"
# without it. This file is the first thing a fresh `./gradlew` checkout needs.

android.useAndroidX=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# AGP 8.5.0 requires Gradle 8.7+. The Colab build notebook pins Gradle 8.9 directly (no wrapper
# is committed); for a local build use `gradle wrapper --gradle-version 8.9` once, then `./gradlew`.
